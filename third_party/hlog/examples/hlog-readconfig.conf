# Baseline for every registered module.
[hlog "all"]
level = "warn"

# Module overrides apply to all current and future instances.
[hlog "bmu"]
level = "info"

[hlog "crg"]
level = "off"

[hlog "its"]
level = "info"

# A full logger display name has the highest precedence.
[hlog "bmu/1"]
level = "trace"
