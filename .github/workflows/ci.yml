name: C++20 SDK verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gcc-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore bundled hlog shared library
        run: bash scripts/restore_hlog.sh
      - name: Build the SDK and all tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Werror'
          cmake --build build --parallel 2
      - name: Run CTest and verify generated documentation
        run: ctest --test-dir build --output-on-failure
      - name: Verify consistent first-party code formatting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-17
          bash scripts/format_cpp.sh --check
